<!DOCTYPE html>
<html lang=en>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="">
	<meta name="keywords" content="">
	<title>Redirect to user's preferred language</title>
	<link rel="manifest" href="/app.webmanifest">
</head>

<body>
	<script type="module">
		import Langs from '/assets/js/modules/site-languages.mjs';
		const userLang = (await Langs.read('../languages.json')).getUserLang();

		window.location.replace(
			'/' + userLang.iso639_1 +
			window.location.pathname +
			window.location.search +
			window.location.hash
		);
	</script>
</body>
</html>
